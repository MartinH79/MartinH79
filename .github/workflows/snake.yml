# Erzeugt täglich die Schlangen-Animation aus der Beitragsgrafik
# und legt sie im Zweig "output" ab (wird im README eingebunden).
name: Schlange

on:
  schedule:
    - cron: "23 4 * * *"     # täglich 04:23 UTC
  workflow_dispatch:          # manuell: Actions → Schlange → Run workflow
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0c3a47,#0e6377,#1696ad,#22d3ee
            dist/snake-light.svg?palette=github-light&color_snake=#0891b2&color_dots=#ebedf0,#cffafe,#67e8f9,#22d3ee,#0891b2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
