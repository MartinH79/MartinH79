<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="AUTONOMO: Autonomer Indoor-Lieferroboter mit RPLidar, Omni-Antrieb, IMU und Kamera-Erkennung mit Edge Impulse.">
<style>.f{font-family:"Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif}.m{font-family:"JetBrains Mono","Fira Code",Consolas,"DejaVu Sans Mono",monospace}.pl{animation:pl 1.8s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}.ln{stroke-dasharray:60 400;animation:ln 4s linear infinite}@keyframes ln{from{stroke-dashoffset:460}to{stroke-dashoffset:0}}</style>
