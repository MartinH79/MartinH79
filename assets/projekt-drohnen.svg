<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="AprilTag-Frachtdrohnen: Flotte aus 8 Quadcoptern, die sich in einer Halle über AprilTags orientiert und Container abholt und abliefert.">
<style>.f{font-family:"Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif}.m{font-family:"JetBrains Mono","Fira Code",Consolas,"DejaVu Sans Mono",monospace}.pl{animation:pl 1.8s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}.ln{stroke-dasharray:60 400;animation:ln 4s linear infinite}@keyframes ln{from{stroke-dashoffset:460}to{stroke-dashoffset:0}}</style>
<rect x="0.5" y="0.5" width="399" height="199" rx="12" fill="#0b1220" stroke="#1f2a44"/>
<path class="ln" d="M14 0.5 H386" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<text x="20" y="38" class="f" font-size="18" font-weight="700" fill="#e6edf3">AprilTag-Frachtdrohnen</text>
<rect x="287" y="20" width="93" height="24" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".6"/>
<circle class="pl" cx="300" cy="32" r="4" fill="#22d3ee"/>
<text x="310" y="36.5" class="f" font-size="12" fill="#22d3ee">in Arbeit</text>
<text x="20" y="64" class="f" font-size="13.5" fill="#c9d1d9">Flotte aus 8 Quadcoptern, die sich in einer Halle</text>
<text x="20" y="83" class="f" font-size="13.5" fill="#c9d1d9">über AprilTags orientiert und Container abholt und</text>
<text x="20" y="102" class="f" font-size="13.5" fill="#c9d1d9">abliefert.</text>
<text x="20" y="125" class="f" font-size="12" font-style="italic" fill="#8b949e">Quadcopter fleet navigating a hall via AprilTags to pick up</text>
<text x="20" y="142" class="f" font-size="12" font-style="italic" fill="#8b949e">and deliver containers.</text>
<rect x="20" y="162" width="81" height="22" rx="6" fill="#0f2233" stroke="#1f2a44"/>
<text x="29" y="177" class="m" font-size="11.5" fill="#22d3ee" textLength="61" lengthAdjust="spacingAndGlyphs">ArduPilot</text>
<rect x="109" y="162" width="46" height="22" rx="6" fill="#0f2233" stroke="#1f2a44"/>
<text x="118" y="177" class="m" font-size="11.5" fill="#22d3ee" textLength="26" lengthAdjust="spacingAndGlyphs">Pi 5</text>
<rect x="163" y="162" width="60" height="22" rx="6" fill="#0f2233" stroke="#1f2a44"/>
<text x="172" y="177" class="m" font-size="11.5" fill="#22d3ee" textLength="40" lengthAdjust="spacingAndGlyphs">OpenCV</text>
<rect x="231" y="162" width="60" height="22" rx="6" fill="#0f2233" stroke="#1f2a44"/>
<text x="240" y="177" class="m" font-size="11.5" fill="#22d3ee" textLength="40" lengthAdjust="spacingAndGlyphs">Python</text>
</svg>